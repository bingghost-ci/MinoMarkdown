[package]
name = "mino-markdown"
version = "0.1.0"
description = "Local-first Markdown editor"
authors = ["MinoMarkdown contributors"]
edition = "2021"

[lib]
name = "mino_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = "1"
serde_json = "1"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "=0.13.6", default-features = false }
percent-encoding = "=2.3.2"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
objc2-foundation = { version = "=0.3.2", features = ["NSFileManager", "NSURL", "NSError", "NSString"] }
